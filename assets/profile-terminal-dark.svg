<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Kanishk Paul — Research &amp; Systems</title>
  <desc id="desc">Artistic header banner illustrating graph constellations, reasoning loops, and intelligent agent systems.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <!-- Accent Line Gradients -->
    <linearGradient id="accent-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="orb-cyan" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-violet" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title-text { fill: #f8fafc; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
    .subtitle-text { fill: #94a3b8; font-size: 14px; font-weight: 400; letter-spacing: 0.02em; }
    .tag-text { fill: #38bdf8; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    .node-label { fill: #cbd5e1; font-size: 11px; font-weight: 500; }
    .pulse-node { animation: pulse 4s ease-in-out infinite alternate; }
    .orbit-path { animation: spin 40s linear infinite; transform-origin: 810px 170px; }
    @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 0.9; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pulse-node, .orbit-path { animation: none; } }
  </style>

  <!-- Container -->
  <rect width="1000" height="340" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1000" height="340" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="280" fill="url(#orb-cyan)"/>
  <circle cx="800" cy="170" r="300" fill="url(#orb-violet)"/>

  <!-- Left Artistic Geometric Constellation -->
  <g opacity="0.85">
    <!-- Connecting Constellation Lines -->
    <path d="M 60 210 L 140 140 L 220 220 L 310 130 L 380 240 L 460 160" fill="none" stroke="url(#accent-cyan-violet)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M 140 140 L 220 70 L 310 130 L 220 220 L 140 140" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>
    <path d="M 310 130 L 380 70 L 460 160" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.35"/>

    <!-- Nodes -->
    <circle cx="60" cy="210" r="4" fill="#2dd4bf" filter="url(#glow)"/>
    <circle cx="140" cy="140" r="5.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="220" cy="70" r="4" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="220" cy="220" r="5" fill="#2dd4bf" filter="url(#glow)"/>
    <circle cx="310" cy="130" r="6" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="380" cy="70" r="4" fill="#f472b6" filter="url(#glow)"/>
    <circle cx="380" cy="240" r="4.5" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="460" cy="160" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Right Geometric Celestial Graph -->
  <g transform="translate(30, 0)">
    <!-- Concentric Rings -->
    <circle cx="780" cy="170" r="110" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 6" opacity="0.7"/>
    <circle cx="780" cy="170" r="75" fill="none" stroke="url(#accent-glow)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="780" cy="170" r="40" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 4" opacity="0.9"/>
    
    <g class="orbit-path">
      <circle cx="780" cy="60" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="855" cy="170" r="5" fill="#c084fc" filter="url(#glow)"/>
      <circle cx="780" cy="245" r="4" fill="#2dd4bf" filter="url(#glow)"/>
      <circle cx="740" cy="170" r="3.5" fill="#818cf8" filter="url(#glow)"/>
    </g>

    <!-- Center Core Node -->
    <circle cx="780" cy="170" r="12" fill="#0f172a" stroke="url(#accent-cyan-violet)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="780" cy="170" r="4" fill="#38bdf8"/>
  </g>

  <!-- Top Accent Bar -->
  <path d="M 60 48 L 940 48" stroke="url(#accent-cyan-violet)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Main Hero Typography & Content -->
  <g transform="translate(60, 115)">
    <text x="0" y="0" class="mono tag-text">RESEARCH &amp; SYSTEMS ARCHITECTURE</text>
    <text x="0" y="42" class="title-text">Kanishk Paul</text>
    <text x="0" y="78" class="subtitle-text">Building at the intersection of reasoning, agents, multilingual NLP, and local models.</text>

    <!-- Micro Pill Tags -->
    <g transform="translate(0, 110)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#2dd4bf"/>
      <text x="26" y="17" class="mono node-label" font-size="10">REASONING</text>

      <!-- Pill 2 -->
      <rect x="118" y="0" width="88" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="132" cy="13" r="3.5" fill="#38bdf8"/>
      <text x="144" y="17" class="mono node-label" font-size="10">AGENTS</text>

      <!-- Pill 3 -->
      <rect x="216" y="0" width="138" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="230" cy="13" r="3.5" fill="#c084fc"/>
      <text x="242" y="17" class="mono node-label" font-size="10">LOCAL INFERENCE</text>

      <!-- Pill 4 -->
      <rect x="364" y="0" width="132" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="378" cy="13" r="3.5" fill="#f472b6"/>
      <text x="390" y="17" class="mono node-label" font-size="10">MULTILINGUAL</text>
    </g>
  </g>

  <!-- Bottom Border Line -->
  <path d="M 60 300 L 940 300" stroke="#1e293b" stroke-width="1"/>
</svg>
