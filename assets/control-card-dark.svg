    <rect x="12" y="12" width="976" height="396" fill="#0d0d10" stroke="#f2efe8" stroke-width="2"/>
    <rect x="12" y="12" width="18" height="396" fill="#8cff32"/>
    <rect x="30" y="12" width="958" height="18" fill="url(#warning)"/>

    <circle cx="829" cy="186" r="126" fill="none" stroke="#6f2da8" stroke-width="30"/>
    <circle cx="829" cy="186" r="82" fill="none" stroke="#8cff32" stroke-width="2"/>
    <circle cx="829" cy="186" r="52" fill="#0d0d10" stroke="#f2efe8" stroke-width="1"/>
    <path d="M829 47V325M690 186H968" stroke="#f2efe8" stroke-width="1" opacity=".34"/>
    <path d="M767 124L891 248M891 124L767 248" stroke="#ff6a00" stroke-width="4"/>
    <text x="829" y="204" text-anchor="middle" fill="#f2efe8" font-family="Arial Narrow, Arial, sans-serif" font-size="54" font-weight="800">01</text>

    <text x="64" y="72" fill="#8cff32" font-family="Arial Narrow, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">PROJECT ID // KP-01</text>
    <text x="64" y="171" fill="#f2efe8" font-family="Georgia, Times New Roman, serif" font-size="86" font-weight="900" letter-spacing="-5">KANISHK</text>
    <text x="60" y="263" fill="#8cff32" font-family="Georgia, Times New Roman, serif" font-size="104" font-weight="900" letter-spacing="-7">PAUL</text>
    <rect x="66" y="281" width="503" height="4" fill="#6f2da8"/>
