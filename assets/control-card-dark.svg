    <text x="959" y="329" transform="rotate(-90 959 329)" fill="#8cff32" font-family="Arial Narrow, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">EVIDENCE BEFORE CLAIMS</text>
    <text x="68" y="395" fill="#ff6a00" font-family="Arial Narrow, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">STATUS // ACTIVE</text>
    <text x="297" y="395" fill="#77757a" font-family="Arial Narrow, Arial, sans-serif" font-size="11" letter-spacing="2">観測 / 推論 / 検証</text>
