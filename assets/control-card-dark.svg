<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Kanishk Paul — systems and research engineer</title>
  <desc id="desc">A stark typographic control card in black, violet, signal green, and orange. Observe, model, verify.</desc>
  <defs>
