      <rect width="12" height="24" fill="#ff6a00"/>
      <rect x="12" width="12" height="24" fill="#121216"/>
    </pattern>
    <clipPath id="frame"><rect x="12" y="12" width="976" height="396" rx="2"/></clipPath>
  </defs>
  <rect width="1000" height="420" fill="#070708"/>
