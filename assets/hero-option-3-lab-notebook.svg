<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Research dossier hero banner</title>
  <desc id="d">A controlled experimental dossier with a clear research identity and a quote by Emily Dickinson.</desc>
  <defs>
    <pattern id="h" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#ff6a00"/>
      <rect x="9" width="9" height="18" fill="#09090b"/>
    </pattern>
  </defs>
  <rect width="1000" height="360" fill="#09090b"/>
  <rect x="18" y="18" width="964" height="324" fill="#e9e4d8" stroke="#ff6a00" stroke-width="4"/>
  <rect x="18" y="18" width="964" height="13" fill="url(#h)"/>
  <path d="M54 63H946M54 293H946" stroke="#17161a" stroke-width="2"/>
  <g font-family="monospace" fill="#17161a">
    <text x="55" y="91" font-size="13" font-weight="700" letter-spacing="2">GITHUB PROFILE // KANISHK PAUL</text>
    <text x="55" y="151" font-size="42" font-weight="700" letter-spacing="-2">KANISHK PAUL</text>
    <text x="56" y="184" font-size="15" letter-spacing="1">AI SYSTEMS / RESEARCH ENGINEERING / KOLKATA</text>
    <text x="55" y="234" font-size="13" font-weight="700" letter-spacing="2">SUBJECT</text>
    <text x="220" y="234" font-size="13">inspectable reasoning systems</text>
    <text x="55" y="262" font-size="13" font-weight="700" letter-spacing="2">PROTOCOL</text>
    <text x="220" y="262" font-size="13">reproducible artifact + negative result</text>
    <text x="945" y="234" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2">REV 2026.08</text>
    <text x="945" y="262" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2">ACCESS // PUBLIC</text>
  </g>
  <text x="770" y="128" text-anchor="middle" fill="#6e2ca1" font-family="monospace" font-size="10" font-weight="700" letter-spacing=".4">WE CAN ONLY SEE A SHORT DISTANCE AHEAD,</text>
  <text x="770" y="150" text-anchor="middle" fill="#6e2ca1" font-family="monospace" font-size="10" font-weight="700" letter-spacing=".4">BUT WE CAN SEE PLENTY THERE THAT NEEDS TO BE DONE.</text>
  <path d="M610 168H930" stroke="#6e2ca1" stroke-width="2"/>
  <text x="770" y="190" text-anchor="middle" fill="#6e2ca1" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.2">ALAN TURING // 1950</text>
</svg>
