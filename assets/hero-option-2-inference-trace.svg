<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Inference trace hero banner</title><desc id="d">A research-control inference trace with four verified stages.</desc><defs><pattern id="h" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="18" fill="#ff6a00"/><rect x="9" width="9" height="18" fill="#09090b"/></pattern></defs><rect width="1000" height="360" fill="#09090b"/><rect x="18" y="18" width="964" height="324" fill="#111116" stroke="#e7e4dc" stroke-width="2"/><rect x="18" y="18" width="964" height="13" fill="url(#h)"/><text x="58" y="84" fill="#a4ff34" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2.6">INFERENCE TRACE // KANISHK PAUL</text><text x="58" y="119" fill="#aaa6a4" font-family="monospace" font-size="14">a research profile rendered as a falsifiable loop</text><path d="M100 210H900" stroke="#5f5c69" stroke-width="3"/><path d="M100 210H300L370 170H560L630 250H900" fill="none" stroke="#a4ff34" stroke-width="5"/><g stroke="#f1ede4" stroke-width="3"><circle cx="100" cy="210" r="16" fill="#111116"/><circle cx="300" cy="210" r="16" fill="#111116"/><circle cx="560" cy="210" r="16" fill="#111116"/><circle cx="900" cy="210" r="16" fill="#111116"/></g><g font-family="monospace" text-anchor="middle"><text x="100" y="259" fill="#ff6a00" font-size="16" font-weight="700" letter-spacing="2">OBSERVE</text><text x="300" y="259" fill="#f1ede4" font-size="16" font-weight="700" letter-spacing="2">MODEL</text><text x="560" y="299" fill="#f1ede4" font-size="16" font-weight="700" letter-spacing="2">TEST</text><text x="900" y="259" fill="#a4ff34" font-size="16" font-weight="700" letter-spacing="2">REVISE</text><text x="100" y="285" fill="#aaa6a4" font-size="11">trace</text><text x="300" y="285" fill="#aaa6a4" font-size="11">hypothesis</text><text x="560" y="325" fill="#aaa6a4" font-size="11">counterexample</text><text x="900" y="285" fill="#aaa6a4" font-size="11">artifact</text></g><text x="942" y="84" text-anchor="end" fill="#ff6a00" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">RUN / 01</text></svg>
