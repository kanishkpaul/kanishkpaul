<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Rotating research orbit</title>
  <desc id="desc">An original animated glyph of orbiting evidence nodes around a central K.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#087f6d" stop-opacity=".14"/><stop offset="1" stop-color="#087f6d" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .outer { transform-origin: 80px 80px; animation: spin 13s linear infinite; }
    .inner { transform-origin: 80px 80px; animation: spin-back 8s linear infinite; }
    .pulse { transform-origin: 80px 80px; animation: pulse 2.8s ease-in-out infinite; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-back { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.93); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .outer, .inner, .pulse { animation: none; } }
  </style>
  <circle cx="80" cy="80" r="76" fill="url(#halo)"/>
  <g class="outer" filter="url(#glow)">
    <circle cx="80" cy="80" r="57" fill="none" stroke="#087f6d" stroke-width="2" stroke-dasharray="5 9"/>
    <circle cx="80" cy="23" r="5" fill="#0969da"/>
    <circle cx="129" cy="109" r="5" fill="#087f6d"/>
    <circle cx="31" cy="109" r="5" fill="#8250df"/>
  </g>
  <g class="inner">
    <ellipse cx="80" cy="80" rx="42" ry="18" fill="none" stroke="#0969da" stroke-width="1.5" opacity=".65"/>
    <circle cx="122" cy="80" r="3.5" fill="#1f2328"/>
  </g>
  <g class="pulse">
    <path d="M80 52L105 80 80 108 55 80Z" fill="#ffffff" stroke="#087f6d" stroke-width="2"/>
    <text x="80" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">K</text>
  </g>
</svg>
