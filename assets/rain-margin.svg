<svg xmlns="http://www.w3.org/2000/svg" width="100" height="1000" viewBox="0 0 100 1000" role="img" aria-label="Falling rain margin animation">
  <defs>
    <linearGradient id="rain-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="rain-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="rain-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    .bg-rect { fill: #0b0f19; }
    .line-border { stroke: #1e293b; stroke-width: 1; }
    @media (prefers-color-scheme: light) {
      .bg-rect { fill: #f8fafc; }
      .line-border { stroke: #cbd5e1; }
    }
  </style>

  <!-- Canvas Background & Right Divider Line -->
  <rect width="100" height="1000" rx="8" class="bg-rect"/>
  <line x1="99" y1="0" x2="99" y2="1000" class="line-border"/>

  <!-- Native SMIL Rain Animations (Sanitizer Compatible) -->

  <!-- Column 1 (x = 15) -->
  <g>
    <line x1="15" y1="0" x2="15" y2="55" stroke="url(#rain-cyan)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="55" r="1.5" fill="#2dd4bf"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.1s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g>
    <line x1="15" y1="0" x2="15" y2="45" stroke="url(#rain-blue)" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="3.6s" repeatCount="indefinite" begin="1.2s"/>
  </g>

  <!-- Column 2 (x = 35) -->
  <g>
    <line x1="35" y1="0" x2="35" y2="65" stroke="url(#rain-violet)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="65" r="1.5" fill="#f472b6"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.9s" repeatCount="indefinite" begin="0.4s"/>
  </g>
  <g>
    <line x1="35" y1="0" x2="35" y2="40" stroke="url(#rain-cyan)" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.3s" repeatCount="indefinite" begin="1.7s"/>
  </g>

  <!-- Column 3 (x = 55) -->
  <g>
    <line x1="55" y1="0" x2="55" y2="50" stroke="url(#rain-blue)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="50" r="1.5" fill="#60a5fa"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="4.0s" repeatCount="indefinite" begin="0.2s"/>
  </g>
  <g>
    <line x1="55" y1="0" x2="55" y2="55" stroke="url(#rain-violet)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.6s" repeatCount="indefinite" begin="2.0s"/>
  </g>

  <!-- Column 4 (x = 75) -->
  <g>
    <line x1="75" y1="0" x2="75" y2="60" stroke="url(#rain-cyan)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="75" cy="60" r="1.5" fill="#2dd4bf"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
  </g>
  <g>
    <line x1="75" y1="0" x2="75" y2="45" stroke="url(#rain-blue)" stroke-width="1.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="3.4s" repeatCount="indefinite" begin="2.2s"/>
  </g>

  <!-- Column 5 (x = 88) -->
  <g>
    <line x1="88" y1="0" x2="88" y2="50" stroke="url(#rain-violet)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="88" cy="50" r="1.5" fill="#c084fc"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="3.3s" repeatCount="indefinite" begin="1.3s"/>
  </g>
  <g>
    <line x1="88" y1="0" x2="88" y2="55" stroke="url(#rain-cyan)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 1050" dur="2.0s" repeatCount="indefinite" begin="0.3s"/>
  </g>
</svg>
