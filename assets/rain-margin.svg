<svg xmlns="http://www.w3.org/2000/svg" width="140" height="1200" viewBox="0 0 140 1200" role="img" aria-label="Rain animation margin">
  <defs>
    <!-- Rain Streak Gradients -->
    <linearGradient id="drop-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="drop-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="drop-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filter for Rain Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0b0f19; }
    .border-line { stroke: #1e293b; stroke-width: 1; }
    
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .border-line { stroke: #e2e8f0; }
    }

    /* Falling Rain Keyframe Animations */
    .rain-fast { animation: fall 2.2s linear infinite; }
    .rain-mid { animation: fall 3.5s linear infinite; }
    .rain-slow { animation: fall 5.2s linear infinite; }
    .rain-delay1 { animation-delay: -0.7s; }
    .rain-delay2 { animation-delay: -1.5s; }
    .rain-delay3 { animation-delay: -2.3s; }
    .rain-delay4 { animation-delay: -3.1s; }

    @keyframes fall {
      0% { transform: translateY(-160px); }
      100% { transform: translateY(1250px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rain-fast, .rain-mid, .rain-slow { animation: none; }
    }
  </style>

  <!-- Left Margin Background -->
  <rect width="140" height="1200" class="bg"/>
  <line x1="139" y1="0" x2="139" y2="1200" class="border-line"/>

  <!-- Rain Streams -->
  <!-- Column 1 (x = 18) -->
  <g class="rain-fast">
    <line x1="18" y1="0" x2="18" y2="60" stroke="url(#drop-cyan)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="18" cy="60" r="1.5" fill="#2dd4bf"/>
  </g>
  <g class="rain-slow rain-delay2">
    <line x1="18" y1="400" x2="18" y2="450" stroke="url(#drop-blue)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Column 2 (x = 42) -->
  <g class="rain-mid rain-delay1">
    <line x1="42" y1="100" x2="42" y2="170" stroke="url(#drop-violet)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="42" cy="170" r="1.5" fill="#e879f9"/>
  </g>
  <g class="rain-fast rain-delay3">
    <line x1="42" y1="600" x2="42" y2="655" stroke="url(#drop-cyan)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Column 3 (x = 68) -->
  <g class="rain-slow rain-delay3">
    <line x1="68" y1="50" x2="68" y2="120" stroke="url(#drop-blue)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="120" r="1.5" fill="#60a5fa"/>
  </g>
  <g class="rain-mid">
    <line x1="68" y1="750" x2="68" y2="820" stroke="url(#drop-violet)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Column 4 (x = 94) -->
  <g class="rain-fast rain-delay2">
    <line x1="94" y1="200" x2="94" y2="275" stroke="url(#drop-cyan)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="94" cy="275" r="1.5" fill="#2dd4bf"/>
  </g>
  <g class="rain-slow rain-delay4">
    <line x1="94" y1="850" x2="94" y2="910" stroke="url(#drop-blue)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Column 5 (x = 118) -->
  <g class="rain-mid rain-delay4">
    <line x1="118" y1="300" x2="118" y2="360" stroke="url(#drop-violet)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="118" cy="360" r="1.5" fill="#c084fc"/>
  </g>
  <g class="rain-fast rain-delay1">
    <line x1="118" y1="950" x2="118" y2="1020" stroke="url(#drop-cyan)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>
