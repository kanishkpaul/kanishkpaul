name: Update README Stats

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-profile-stats
  push:
    branches:
      - main
  schedule:
    # GitHub's shortest supported interval. Scheduled runs can still be delayed.
    - cron: "*/5 * * * *"

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh README stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/update_readme_stats.py

      - name: Commit README changes
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README stats"
          git push
